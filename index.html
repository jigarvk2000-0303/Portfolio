<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigar Vakharia | Data Analyst Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #3b82f6;
            --main-bg: #0f172a;       /* Dark Slate Background */
            --card-bg: #1e293b;       /* Card Background */
            --section-alt: #020617;   /* Deeper Background */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 8%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--primary-blue);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--primary-blue); }

        .btn-contact {
            background: var(--primary-blue);
            color: white !important;
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
        }

        /* --- Hero --- */
        .hero {
            display: flex;
            min-height: 85vh;
            align-items: center;
            padding: 0 8%;
            background: linear-gradient(135deg, var(--main-bg) 0%, var(--section-alt) 100%);
        }

        .hero-left { flex: 1; }
        .hero-right { flex: 1; display: flex; justify-content: center; }

        .hero-left h2 { color: var(--text-muted); font-size: 1.5rem; margin-bottom: 0.5rem; }
        .hero-left h1 { font-size: 4rem; font-weight: 900; line-height: 1.1; margin-bottom: 1rem; }
        .text-highlight { color: var(--primary-blue); }
        .hero-left p { font-size: 1.25rem; color: var(--text-muted); max-width: 500px; }

        .social-icons { margin-top: 2.5rem; display: flex; gap: 15px; }
        .social-icon-box {
            width: 45px; height: 45px; background: var(--card-bg);
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; color: var(--text-main);
            text-decoration: none; border: 1px solid var(--border-color);
            transition: 0.3s;
        }
        .social-icon-box:hover { background: var(--primary-blue); transform: translateY(-3px); }

        .profile-img {
            width: 80%; max-width: 400px; border-radius: 24px;
            border: 8px solid var(--card-bg); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* --- Sections --- */
        section { padding: 100px 8%; }
        .section-header { text-align: center; margin-bottom: 60px; }
        .section-tag { color: var(--primary-blue); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        .section-title { font-size: 2.5rem; font-weight: 800; }

        .summary-box {
            background: var(--card-bg); padding: 3rem; border-radius: 24px;
            font-size: 1.2rem; color: var(--text-muted); text-align: center;
            max-width: 900px; margin: 0 auto; border: 1px solid var(--border-color);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        
        .card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 2rem; transition: 0.3s;
        }
        .card:hover { transform: translateY(-7px); border-color: var(--primary-blue); }

        .card h3 { margin-bottom: 1rem; color: var(--text-main); }
        .card p, .card li { color: var(--text-muted); font-size: 0.95rem; }
        .card ul { list-style: none; margin-top: 1rem; }
        .card li { margin-bottom: 0.8rem; display: flex; align-items: flex-start; }
        .card li::before {
            content: "\f058"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            color: var(--primary-blue); margin-right: 10px;
        }

        .skill-icon { font-size: 2rem; color: var(--primary-blue); margin-bottom: 1rem; }
        .role-tag {
            display: inline-block; background: rgba(59, 130, 246, 0.1);
            color: var(--primary-blue); padding: 4px 12px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 700; margin-bottom: 10px;
        }

        /* --- Contact --- */
        #contact { background: var(--section-alt); text-align: center; }
        .contact-container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 30px; }
        .contact-item {
            display: flex; align-items: center; gap: 15px; font-size: 1.2rem;
            color: var(--text-main); background: var(--card-bg);
            padding: 1rem 2rem; border-radius: 15px; border: 1px solid var(--border-color);
            text-decoration: none; transition: 0.3s;
        }
        .contact-item:hover { border-color: var(--primary-blue); transform: scale(1.05); }

        footer { text-align: center; padding: 40px; border-top: 1px solid var(--border-color); color: var(--text-muted); }
