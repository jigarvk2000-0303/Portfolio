<style>

:root{
--blue:#3b82f6;
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
scroll-behavior:smooth;
}

body{
background:var(--bg);
color:var(--text);
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
border-bottom:1px solid #334155;
position:sticky;
top:0;
background:#0f172ae6;
backdrop-filter:blur(10px);
}

.logo{
font-size:22px;
font-weight:800;
color:var(--blue);
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav a{
text-decoration:none;
color:var(--text);
font-weight:600;
}

nav a:hover{
color:var(--blue);
}

.btn{
background:var(--blue);
padding:10px 18px;
border-radius:25px;
text-decoration:none;
color:white;
font-weight:600;
}

.hero{
display:flex;
align-items:center;
justify-content:space-between;
padding:80px 8%;
min-height:80vh;
}

.hero-text{
max-width:600px;
}

.hero h1{
font-size:55px;
font-weight:800;
margin-bottom:10px;
}

.hero h2{
color:var(--muted);
margin-bottom:20px;
}

.hero p{
color:var(--muted);
margin-bottom:25px;
}

.contact-icons{
display:flex;
gap:15px;
margin-bottom:25px;
}

.contact-icons a{
width:45px;
height:45px;
display:flex;
align-items:center;
justify-content:center;
background:var(--card);
border-radius:10px;
color:white;
text-decoration:none;
}

.contact-icons a:hover{
background:var(--blue);
}

.hero img{
width:350px;
border-radius:20px;
border:6px solid var(--card);
}

section{
padding:80px 8%;
}

.section-title{
text-align:center;
font-size:35px;
margin-bottom:40px;
}

.summary{
max-width:800px;
margin:auto;
text-align:center;
background:var(--card);
padding:30px;
border-radius:20px;
color:var(--muted);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:var(--card);
padding:25px;
border-radius:18px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
border:1px solid var(--blue);
}

.card h3{
margin-bottom:10px;
}

.card p{
color:var(--muted);
}

.project-btn{
margin-top:15px;
display:inline-block;
padding:8px 14px;
background:var(--blue);
border-radius:20px;
color:white;
text-decoration:none;
font-size:14px;
}

.timeline{
display:grid;
gap:25px;
}

.contact-box{
display:flex;
flex-direction:column;
gap:15px;
align-items:center;
}

.contact-box a{
display:flex;
align-items:center;
gap:10px;
padding:12px 20px;
background:var(--card);
border-radius:12px;
text-decoration:none;
color:white;
}

.contact-box a:hover{
background:var(--blue);
}

footer{
text-align:center;
padding:30px;
color:var(--muted);
border-top:1px solid #334155;
}

@media(max-width:900px){

.hero{
flex-direction:column;
text-align:center;
}

.hero img{
margin-top:30px;
}

nav ul{
display:none;
}

}

</style>
</head>
